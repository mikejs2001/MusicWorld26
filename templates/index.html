<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicWorld26 — Mood Selector</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header>
    <h1>MusicWorld26</h1>
    <p>Upload your music, pick your mood, and let the vibe play</p>
</header>

<!-- Upload -->
<section class="upload-section">
    <div class="upload-area" id="upload-area">
        <div class="upload-icon">&#127925;</div>
        <p>Drop audio files here or click to upload</p>
        <p style="font-size:0.8rem; color:#666; margin-top:6px">MP3, WAV, OGG, FLAC, M4A</p>
    </div>
    <input type="file" id="file-input" accept=".mp3,.wav,.ogg,.flac,.m4a" multiple hidden>
    <div id="upload-status"></div>
</section>

<!-- Mood selector -->
<section class="mood-section">
    <h2>How are you feeling?</h2>
    <div class="mood-grid" id="mood-grid"></div>
</section>

<!-- Playlist -->
<section class="playlist-section">
    <h2 id="playlist-title">Select a mood to see your playlist</h2>
    <div class="track-count" id="track-count"></div>
    <ul class="track-list" id="track-list"></ul>
    <div class="playlist-empty" id="playlist-empty"></div>
</section>

<!-- Audio player bar -->
<div class="player-bar" id="player-bar">
    <div class="player-controls">
        <button id="btn-prev" title="Previous">&#9198;</button>
        <button id="btn-play" title="Play/Pause">&#9654;</button>
        <button id="btn-next" title="Next">&#9197;</button>
    </div>
    <div class="player-track-info">
        <div class="player-track-name" id="player-track-name">—</div>
    </div>
    <div class="player-progress-container">
        <span class="player-time" id="time-elapsed">0:00</span>
        <div class="player-progress" id="progress-bar">
            <div class="player-progress-fill" id="progress-fill"></div>
        </div>
        <span class="player-time" id="time-duration">0:00</span>
    </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
